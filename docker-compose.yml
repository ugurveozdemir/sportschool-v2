services:
  postgres:
    image: postgres:17-alpine
    container_name: sportschool-v2-postgres
    environment:
      POSTGRES_DB: sportschool
      POSTGRES_USER: sportschool
      POSTGRES_PASSWORD: sportschool
    ports:
      - "5433:5432"
    volumes:
      - sportschool-v2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportschool -d sportschool"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportschool-v2-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=sportschool;Username=sportschool;Password=sportschool"
      DevSeed__Enabled: "${DEV_SEED_ENABLED:-false}"
      DevSeed__PlatformOwnerPassword: "${DEV_SEED_PLATFORM_OWNER_PASSWORD:-}"
      DevSeed__CoachPassword: "${DEV_SEED_COACH_PASSWORD:-}"
      DevSeed__AthletePassword: "${DEV_SEED_ATHLETE_PASSWORD:-}"
    ports:
      - "5062:8080"
    volumes:
      - sportschool-v2-media-data:/app/AppData/Media

volumes:
  sportschool-v2-postgres-data:
  sportschool-v2-media-data:
